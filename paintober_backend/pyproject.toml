[project]
name = "paintober-backend"
version = "0.1.0"
description = "Paintober Django backend"
authors = []
requires-python = "^3.13"
dependencies = [
    "django>=6.0.4,<7",
    "djangorestframework>=3.17.1,<4",
    "django-apscheduler>=0.7.0,<1",
    "numpy>=2.4.4,<3",
    "scipy>=1.17.1,<2",
    "scikit-image>=0.25.2,<1",
    "scikit-learn>=1.8.0,<2",
    "joblib>=1.5.3,<2",
    "opencv-python>=4.13.0,<5",
    "Pillow>=12.2.0,<13",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "django-cors-headers>=4.7.0,<5",
    "python-decouple>=3.8,<4",
    "psycopg2-binary>=2.9,<3",
    "gunicorn>=22.0.0,<24",
]

[tool.poetry.group.dev.dependencies]
ipython = "^9.13.0"
ipykernel = "^7.2.0"
ipywidgets = "^8.1.8"
debugpy = "^1.8.20"
matplotlib = "^3.10.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
