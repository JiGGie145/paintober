[package]
name = "paintober_native"
version = "0.1.0"
edition = "2021"
description = "Native Rust acceleration for Paintober pipeline helpers"
license = "MIT"

[lib]
name = "paintober_native"
crate-type = ["cdylib"]

[dependencies]
ndarray = "0.16"
numpy = "0.26"
pyo3 = { version = "0.26", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
